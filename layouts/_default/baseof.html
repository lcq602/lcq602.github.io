<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}">
  <link rel="stylesheet" href="{{ "css/anime-bg.css" | relURL }}">
  <script src="{{ "js/site.js" | relURL }}" defer></script>
</head>
<body>
  <div class="global-video-bg" aria-hidden="true">
    <video id="global-bg-video" autoplay muted loop playsinline preload="auto" poster="{{ "img/mikasa-sunset-poster.jpg" | relURL }}">
      <source src="{{ "video/mikasa-sunset.mp4" | relURL }}" type="video/mp4">
    </video>
    <div class="global-video-shade"></div>
    <div class="global-video-glow"></div>
  </div>
  {{ partial "header.html" . }}
  <main>{{ block "main" . }}{{ end }}</main>
  {{ partial "footer.html" . }}
  <script>
    (() => {
      const video = document.getElementById('global-bg-video');
      if (!video) return;
      video.muted = true;
      video.defaultMuted = true;
      const start = () => {
        const p = video.play();
        if (p && typeof p.catch === 'function') p.catch(() => {});
      };
      if (video.readyState >= 2) start();
      else video.addEventListener('canplay', start, { once: true });
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) start();
      });
    })();
  </script>
</body>
</html>
