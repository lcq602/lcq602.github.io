<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ site.Params.description }}{{ end }}">
  <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Title }}{{ end }}</title>
  <link rel="stylesheet" href="{{ "css/site.css" | relURL }}?v=202609071950">
  <link rel="stylesheet" href="{{ "css/anime-bg.css" | relURL }}?v=202609071950">
  <style>
    html{background:#070812!important}
    body{background:transparent!important;position:relative!important;min-height:100vh!important}
    body::before,body::after{display:none!important}
    .global-video-bg{position:fixed!important;inset:0!important;z-index:0!important;overflow:hidden!important;background:#070812!important;pointer-events:none!important}
    .global-video-poster{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;object-fit:cover!important;object-position:center!important;z-index:0!important;display:block!important;opacity:1!important}
    .global-video-bg video{position:absolute!important;inset:0!important;width:100%!important;height:100%!important;min-width:100%!important;min-height:100%!important;object-fit:cover!important;object-position:center!important;z-index:1!important;display:block!important;opacity:1!important;transform:none!important;filter:saturate(.98) contrast(1.03) brightness(.9)!important}
    .global-video-shade{position:absolute!important;inset:0!important;z-index:2!important;background:linear-gradient(90deg,rgba(3,5,12,.48),rgba(5,7,15,.16) 50%,rgba(4,6,13,.28)),linear-gradient(180deg,rgba(6,8,18,.05),rgba(4,5,12,.34))!important}
    .global-video-glow{display:none!important}
    .site-header,main,.site-footer{position:relative!important;z-index:10!important}
    .hero,.collection,.page-hero,.listing,.article,.archive-list{background:transparent!important}
  </style>
  <script src="{{ "js/site.js" | relURL }}?v=202609071950" defer></script>
</head>
<body>
  <div class="global-video-bg" aria-hidden="true">
    <img class="global-video-poster" src="{{ "img/mikasa-sunset-poster.jpg" | relURL }}?v=202609071950" alt="">
    <video id="global-bg-video" autoplay muted loop playsinline preload="auto" poster="{{ "img/mikasa-sunset-poster.jpg" | relURL }}?v=202609071950">
      <source src="{{ "video/mikasa-sunset.mp4" | relURL }}?v=202609071950" type="video/mp4">
    </video>
    <div class="global-video-shade"></div>
  </div>
  {{ partial "header.html" . }}
  <main>{{ block "main" . }}{{ end }}</main>
  {{ partial "footer.html" . }}
  <script>
    (() => {
      const video = document.getElementById('global-bg-video');
      if (!video) return;
      video.muted = true;
      video.defaultMuted = true;
      video.setAttribute('muted', '');
      video.setAttribute('playsinline', '');
      const start = () => {
        const p = video.play();
        if (p && typeof p.catch === 'function') p.catch(() => {});
      };
      start();
      video.addEventListener('loadeddata', start, { once: true });
      video.addEventListener('canplay', start, { once: true });
      document.addEventListener('visibilitychange', () => { if (!document.hidden) start(); });
    })();
  </script>
</body>
</html>
