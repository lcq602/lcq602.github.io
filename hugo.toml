baseURL = "https://lcq602.github.io/"
title = "林允的博客"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
preserveTaxonomyNames = true
hasCJKLanguage = true
enableRobotsTXT = true

[pagination]
  pagerSize = 5

[module]
  [[module.imports]]
    path = "github.com/zhaohuabing/hugo-theme-cleanwhite"

[outputs]
  home = ["HTML", "RSS"]

[params]
  header_image = "img/home-bg.svg"
  SEOTitle = "林允的博客"
  description = "记录技术探索、工程实践与独立开发"
  keyword = "Java, AI Agent, DevOps, Godot, 技术博客"
  slogan = "愿每一次探索，都留下清晰的答案"
  upstreamAttribution = true

  image_404 = "img/404-bg.svg"
  title_404 = "这里暂时还没有内容"
  omit_categories = false

  page_view_counter = false
  algolia_search = false
  reward = false
  friends = false
  bookmarks = false
  about_me = false
  last_posts = false

  auto_theme = true
  dark_mode_toggle = true

  sidebar_about_description = "Java 后端、AI Agent、DevOps 与独立游戏开发"
  featured_tags = true
  featured_condition_size = 1

  ba_track_id = ""
  disqus_proxy = ""
  disqus_site = ""
  twikoo_env_id = ""
  artalk_enable = false
  artalk_server = ""
  artalk_site = ""

  [params.social]
    rss = true
    github = "https://github.com/lcq602"

  [[params.additional_menus]]
    title = "ARCHIVE"
    href = "/archive/"

  [[params.additional_menus]]
    title = "ABOUT"
    href = "/about/"

[services]
  [services.disqus]
    shortname = ""
  [services.googleAnalytics]
    id = ""

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
  [markup.highlight]
    style = "dracula"
    lineNos = true
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[mediaTypes]
  [mediaTypes."font/woff"]
    suffixes = ["woff"]
  [mediaTypes."font/woff2"]
    suffixes = ["woff2"]
