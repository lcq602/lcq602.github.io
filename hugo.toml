baseURL = "https://lcq602.github.io/"
title = "林允的收藏夹"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
hasCJKLanguage = true
enableRobotsTXT = true

[pagination]
  pagerSize = 12

[taxonomies]
  category = "categories"
  tag = "tags"

[params]
  description = "电影、动漫、学习，以及值得记录的一切"
  author = "林允"
  mainSections = ["post"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "github-dark"
    lineNos = true

