baseURL: "https://lcq602.github.io/"
languageCode: "zh-cn"
defaultContentLanguage: "zh"
title: "林允的技术博客"
theme: ["github.com/adityatelange/hugo-PaperMod"]
enableRobotsTXT: true
summaryLength: 120

pagination:
  pagerSize: 10

minify:
  disableXML: true

params:
  env: production
  title: "林允的技术博客"
  description: "记录技术探索、工程实践与开发思考"
  author: "林允"
  defaultTheme: auto
  mainSections:
    - posts
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  homeInfoParams:
    Title: "你好，我是林允 👋"
    Content: "记录技术探索、工程实践与开发思考。分享 Java 后端、AI Agent、DevOps，以及那些真正解决过问题的经验。"

menu:
  main:
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 10
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 20
    - identifier: search
      name: 搜索
      url: /search/
      weight: 30

outputs:
  home:
    - HTML
    - RSS
    - JSON
