baseURL: "https://lcq602.github.io/"
languageCode: "zh-cn"
defaultContentLanguage: "zh-cn"
hasCJKLanguage: true
title: "林允 · 开发札记"
enableRobotsTXT: true

pagination:
  pagerSize: 6

module:
  imports:
    - path: "github.com/CaiJimmy/hugo-theme-stack/v4"

params:
  mainSections:
    - posts
  rssFullContent: true
  description: "记录 Java 后端、AI Agent、DevOps 与独立游戏开发"
  keywords:
    - Java
    - AI Agent
    - DevOps
    - Godot
  footer:
    since: 2026
    customText: "记录真实的开发过程与解决方案"
  dateFormat:
    published: "2006年01月02日"
    lastUpdated: "2006年01月02日 15:04"
  sidebar:
    compact: false
    emoji: "🚀"
    subtitle: "Java 后端 · AI Agent · DevOps · Godot"
    avatar: "img/avatar.svg"
  article:
    headingAnchor: true
    math: false
    toc: true
    readingTime: true
    list:
      showTags: true
    license:
      enabled: false
      default: ""
  widgets:
    homepage:
      - type: search
      - type: archives
        params:
          limit: 5
      - type: categories
        params:
          limit: 10
      - type: tag-cloud
        params:
          limit: 12
    page:
      - type: toc
  colorScheme:
    toggle: true
    default: auto
  imageProcessing:
    autoOrient: true
    external:
      timeout: "5s"
    content:
      widths:
        - 800
        - 1600
      enabled: true
    thumbnail:
      enabled: true
  comments:
    enabled: false
    provider: ""

menu:
  main:
    - identifier: home
      name: 首页
      url: /
      weight: 10
      params:
        icon: home
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 20
      params:
        icon: article
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 30
      params:
        icon: archives
    - identifier: search
      name: 搜索
      url: /search/
      weight: 40
      params:
        icon: search
  social:
    - identifier: github
      name: GitHub
      url: "https://github.com/lcq602"
      params:
        icon: brand-github
        newTab: true

related:
  includeNewer: true
  threshold: 60
  toLower: false
  indices:
    - name: tags
      weight: 100
    - name: categories
      weight: 200

markup:
  goldmark:
    renderer:
      unsafe: true
  tableOfContents:
    startLevel: 2
    endLevel: 4
    ordered: false
  highlight:
    noClasses: false
    codeFences: true
    guessSyntax: true
    lineNos: true
    lineNumbersInTable: true
    tabWidth: 4
