baseURL: "https://lcq602.github.io/"
languageCode: "zh-cn"
defaultContentLanguage: "zh"
title: "林允 · 开发札记"
theme: ["github.com/adityatelange/hugo-PaperMod"]
enableRobotsTXT: true
summaryLength: 120

pagination:
  pagerSize: 10

minify:
  disableXML: true

params:
  env: production
  title: "林允 · 开发札记"
  description: "记录 Java 后端、AI Agent、DevOps 与独立游戏开发"
  keywords:
    - Java
    - AI Agent
    - DevOps
    - Godot
  author: "林允"
  defaultTheme: auto
  disableThemeToggle: false
  mainSections:
    - posts
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowToc: true
  TocOpen: false
  ShowWordCount: true
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  homeInfoParams:
    Title: "把踩过的坑，写成能复用的经验。"
    Content: "这里记录 Java 后端、AI Agent、DevOps 与 Godot 独立游戏开发。少一些空泛概念，多一些真正跑通过的代码、排错过程和实践总结。"
  socialIcons:
    - name: github
      title: "查看我的 GitHub"
      url: "https://github.com/lcq602"

menu:
  main:
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 10
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 20
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 30
    - identifier: search
      name: 搜索
      url: /search/
      weight: 40

outputs:
  home:
    - HTML
    - RSS
    - JSON
